
server.port=8083

spring.kafka.bootstrap-servers=localhost:9092,localhost:9094
spring.kafka.consumer.group-id=product-grp
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ParseStringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer


spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=orderDB
#spring.data.mongodb.uri=mongodb://localhost:27017/orderDB

spring.datasource.hikari.maximum-pool-size=1000000
spring.datasource.hikari.leak-detection-threshold=1000
logging.level.com.zaxxer=DEBUG
logging.level.root=debug